[project]
name = "fde-agent-kit"
version = "0.1.0"
description = "A reusable kit for dropping an LLM agent into a customer environment: connectors, evals, observability, human review."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Christian Zaia" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "pypdf>=4.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.2"]
postgres = ["psycopg[binary]>=3.1"]
langfuse = ["langfuse>=2.0"]

[project.scripts]
fde-kit = "fde_kit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fde_kit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/fde_kit/demo_app.py" = ["E501"]  # inline HTML/CSS/JS templates
