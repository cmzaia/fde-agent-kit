# `docker compose up --build` -> service on :8000 (webhook + review queue) backed by Postgres.
# Runs with no API key: LLM_PROVIDER defaults to the deterministic fake model.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fde-local-only}
      POSTGRES_DB: fde
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fde -d fde"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REVIEW_DB_URL: postgresql+psycopg://fde:${POSTGRES_PASSWORD:-fde-local-only}@db:5432/fde
      FDE_REVIEW_API_KEY: ${FDE_REVIEW_API_KEY:-}
      FDE_WEBHOOK_SECRET: ${FDE_WEBHOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

volumes:
  pgdata:
